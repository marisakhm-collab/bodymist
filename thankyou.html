<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับคำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou-section {
      min-height: calc(100vh - 84px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 0;
    }

    .thankyou-card {
      max-width: 580px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      padding: 4.5rem 3rem;
    }

    .thankyou-icon {
      width: 48px;
      height: 48px;
      border: 1px solid var(--accent-gold);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      font-family: var(--font-serif);
      font-size: 1.35rem;
      margin-bottom: 1.75rem;
    }

    .thankyou-title {
      font-size: clamp(1.85rem, 3.5vw, 2.5rem);
      margin-bottom: 1rem;
    }

    .thankyou-text {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.85;
      margin-bottom: 2.75rem;
    }

    @media (max-width: 768px) {
      .thankyou-section {
        min-height: calc(100vh - 72px);
      }

      .thankyou-card {
        padding: 3rem 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">Body Scent</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="order.html">สั่งซื้อ</a>
      </nav>
    </div>
  </header>

  <!-- Thank You Content -->
  <main class="thankyou-section">
    <div class="container">
      <div class="thankyou-card">
        <div class="thankyou-icon">&#10003;</div>
        <span class="eyebrow">Order Received</span>
        <h1 class="thankyou-title">ขอบคุณสำหรับคำสั่งซื้อ</h1>
        <hr class="divider">
        <p class="thankyou-text">
          เราได้รับข้อมูลการสั่งซื้อของคุณเรียบร้อยแล้ว ทีมงานจะรีบตรวจสอบรายการและติดต่อกลับผ่านช่องทางที่คุณระบุไว้โดยเร็วที่สุด
        </p>
        <a href="index.html" class="btn">กลับหน้าแรก</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
